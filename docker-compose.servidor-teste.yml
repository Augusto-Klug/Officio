services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${Database__Password:?Configure Database__Password in deploy/servidor-teste.env}
      MSSQL_MEMORY_LIMIT_MB: 4096
    volumes:
      - officio-servidor-teste-sql:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Officio.WebApi/Dockerfile
      secrets:
        - sixlabors_license
    env_file:
      - ${OFFICIO_ENV_FILE:-./deploy/servidor-teste.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=OfficioEnsaioServidor;User Id=sa;Password=${Database__Password};Encrypt=False;TrustServerCertificate=True;Connect Timeout=30"
    depends_on:
      sql-server:
        condition: service_healthy
    mem_limit: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --max-time 5 http://127.0.0.1:8080/health/live || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  officio-servidor-teste-sql:
    name: officio-servidor-teste-sql

secrets:
  sixlabors_license:
    file: ./deploy/sixlabors.lic
